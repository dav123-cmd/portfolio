{% load static %}<!DOCTYPE html>
<html lang="en" class="scroll-smooth"
  x-data="{
    dark: localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches),
    sc: false,
    mm: false,
    s: '',
    progress: 0
  }"
  :class="{'dark':dark}"
  x-init="
    $watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'));
    const ids = ['services','work','about','reviews','blog','contact'];
    const update = () => {
      sc = window.scrollY > 20;
      const max = document.body.scrollHeight - window.innerHeight;
      progress = max > 0 ? Math.min(100, Math.round(window.scrollY / max * 100)) : 0;
      let cur = '';
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= 120) cur = id;
      }
      s = cur;
    };
    window.addEventListener('scroll', update, { passive: true });
    update();
  ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ profile.full_name }} — {{ profile.role }}{% endblock %}</title>
<meta name="description" content="{% block meta_description %}{{ profile.tagline }}{% endblock %}">
<meta property="og:title" content="{% block og_title %}{{ profile.full_name }} — {{ profile.role }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ profile.tagline }}{% endblock %}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">

<!-- Set the theme before first paint (avoids a light-mode flash) -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/david.css' %}">
{% block extra_head %}{% endblock %}
</head>

<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased">
{% include 'partials/navbar.html' %}

{% block content %}{% endblock %}

{% include 'partials/footer.html' %}

<script src="{% static 'js/david.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
